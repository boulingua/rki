# ─────────────────────────────────────────────────────────────────────────
# rki — Русский как иностранный (Russian as a foreign language).
# Instantiated from the canonical boulingua template `pagegen`; only the
# per-course values marked in the template are changed here. Everything else
# (markup, pagination, ToC, taxonomies, module import) is the shared standard.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/rki/"
title = "Русский — RKI — S. Le Boulanger"
languageCode = "ru"
defaultContentLanguage = "ru"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "RKI"
  author = "S. Le Boulanger"
  description = "Russisch als Fremdsprache / Russian as a foreign language — a free, openly licensed course from the Cyrillic alphabet (Level 0) to B2, with curriculum-aligned units, model exams, worksheets, slide decks and native-voice audio."
  keywords = "Russisch,Russisch als Fremdsprache,Russian,русский язык,RKI,Kyrillisch,Cyrillic,CEFR,GER,A1,A2,B1,B2,Gesamtschule,OER,Curriculum"
  dateFormat = "2006-01-02"
  since = 2026
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (rki: #198D5B light / #7EE7B9 dark). Never edit the CSS to change it.
  code = "rki"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance in Germany (see /datenschutz/). Leave `domain` empty to disable.
    domain = "boulingua.github.io/rki"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/rki"

# ── Navigation — mirrors content/<section>/. Start lives behind the navbar
